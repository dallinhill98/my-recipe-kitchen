<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Recipe Kitchen</title><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2"><link rel="icon" type="image/x-icon" href="/favicon.ico?v=2"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#fff;--side:#f8f8f8;--fg:#222;--muted:#777;--line:#e6e6e6;--selected:#eaeaea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}.layout{display:grid;grid-template-columns:310px 1fr;min-height:100vh}aside{background:var(--side);border-right:1px solid var(--line);padding:22px 15px}main{padding:48px max(24px,calc((100vw - 1080px)/2));max-width:1000px;width:100%}h1{font-size:30px;letter-spacing:-.03em}h2{font-size:18px;margin-top:34px}.brand{font-weight:700;font-size:18px;margin-bottom:20px}.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:23px 0 8px}input[type=search]{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--bg);color:var(--fg);font:inherit}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--fg);padding:6px 10px;cursor:pointer}.chip.on{background:var(--fg);color:var(--bg)}.recipe{width:100%;display:block;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--fg);padding:12px 9px;cursor:pointer;font:inherit}.recipe.on,.recipe:hover{background:var(--selected)}.recipe-entry{display:flex;align-items:center;gap:4px}.recipe-entry .recipe{flex:1;min-width:0}.favorite-toggle{border:0;background:transparent;color:var(--fg);font-size:23px;cursor:pointer;padding:7px;border-radius:8px}.favorite-toggle:hover{background:var(--selected)}.favorite-toggle[aria-pressed="true"]{color:#d99a17}.favorite-action{border:1px solid var(--line);border-radius:10px;background:var(--side);color:var(--fg);font:inherit;padding:9px 12px;cursor:pointer}.small{font-size:12px;color:var(--muted)}.subtitle{color:var(--muted)}.tags{margin:18px 0;display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:20px;background:var(--side);padding:5px 10px;font-size:13px}.row{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px}.row label{display:flex;gap:10px}.row a{white-space:nowrap;color:inherit;font-size:13px}.steps li{padding:0 0 15px 5px}.notice{background:var(--side);border:1px solid var(--line);padding:15px;border-radius:12px;font-size:13px;margin-top:25px}.stepper{display:flex;gap:15px;align-items:center}.stepper button{border:1px solid var(--line);border-radius:9px;padding:5px 12px;background:var(--side);color:var(--fg);cursor:pointer}.flex{display:flex;align-items:center;justify-content:space-between}.empty{padding:15px;color:var(--muted)}@media(max-width:700px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:22px}.recipe{padding:9px}.brand{margin-bottom:12px}}@media(prefers-color-scheme:dark){:root{--bg:#212121;--side:#171717;--fg:#f4f4f4;--muted:#aaa;--line:#393939;--selected:#303030}}
.sync-panel{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px}.sync-panel button{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);padding:8px 10px;cursor:pointer}.sync-panel input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}.sync-panel .sync-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.sync-panel .sync-status{font-size:12px;color:var(--muted);margin-top:8px}.sync-panel .sync-code{font-size:30px;font-weight:750;letter-spacing:.2em;margin:10px 0}</style><div class="layout"><aside><div class="brand">🍽️ My Recipe Kitchen</div><input id="search" type="search" placeholder="Search recipes…"><div class="label">🍽️ FILTER BY MEAL</div><div id="meals" class="chips"></div><div class="label">RECIPES</div><button id="favoritesFilter" class="chip" type="button" aria-pressed="false" style="margin:0 0 10px">☆ Favorites only</button><div id="list"></div><section class="sync-panel" aria-label="Favorites syncing"><div class="small" style="font-weight:700;margin-bottom:8px">☁️ FAVORITES SYNC</div><div id="syncControls"></div><div id="syncStatus" class="sync-status" role="status" aria-live="polite"></div></section></aside><main id="detail"></main></div><script>
const recipes=[{"id":"peach-chai","name":"🍑 Peach Chai Protein Smoothie","meal":["Breakfast","Smoothies"],"ingredients":["Peaches","Oats","Protein Powder","Peanut Butter"],"servings":1,"items":[["Jif Natural Creamy Peanut Butter",33,"g"],["Great Value Old Fashioned Oats",40,"g"],["Manitoba Harvest Hemp Hearts",40,"g"],["Sunwarrior Organic Vanilla Protein Powder",26,"g"],["TAZO Classic Chai Latte Concentrate",120,"g"],["Planet Oat Barista Lovers Oatmilk",120,"g"],["Great Value Frozen Sliced Peaches",210,"g"]],"products":[{"upc":"051500243213","url":"https://www.walmart.com/ip/21096191"},{"upc":"078742371047","url":"https://www.walmart.com/ip/10314925"},{"upc":"697658201219","url":"https://www.walmart.com/ip/17081672273"},{"upc":"810100920968","url":"https://www.walmart.com/ip/5522276790"},{"upc":"794522703005","url":"https://www.walmart.com/ip/14869684"},{"upc":"044100190926","url":"https://www.walmart.com/ip/5040429010"},{"upc":"078742431031","url":"https://www.walmart.com/ip/10543667"}],"steps":["Add oatmilk and chai concentrate to a blender.","Add peanut butter, oats, hemp hearts, protein powder and frozen peaches.","Blend until smooth. Add a little water if needed."],"note":"Seven exact Walmart products with confirmed UPCs. Check ingredient labels for your food allergies; UPC confirmation does not verify allergen safety."},{"id":"maple","name":"🍁 Maple-Ginger Chicken & Rice Bowls","meal":["Dinner","Meal Prep"],"ingredients":["Chicken","Rice"],"servings":3,"items":[["Chicken breast",800,"g"],["Dry white rice",278,"g"],["Water for rice",2,"cups"],["Verified-safe cooking oil",28,"g"],["Coconut aminos (check label)",6,"tbsp"],["Pure maple syrup",3,"tbsp"],["Brown sugar",1,"tbsp"],["Ground ginger",1.25,"tsp"],["Onion powder",1.375,"tsp"],["Smoked paprika",1,"tsp"],["Cornstarch",1.5,"tsp"]],"steps":["Cook rice according to its package directions.","Season chicken with ginger, onion powder and paprika; cook in oil to 165°F.","Simmer coconut aminos, maple syrup and brown sugar with a splash of water; thicken with cornstarch slurry.","Toss chicken with sauce and serve over rice."],"note":"Based on your earlier chicken bowl; simplified demonstration quantities."},{"id":"salmon","name":"🍯 Honey-Lime Salmon & Rice","meal":["Dinner"],"ingredients":["Salmon","Rice"],"servings":2,"items":[["Skinless salmon",16,"oz"],["Dry white rice",0.75,"cup"],["Honey",2,"tbsp"],["Fresh lime juice",2,"tbsp"],["Olive oil",1,"tbsp"],["Salt",0.5,"tsp"],["Broccoli",2,"cups"]],"steps":["Heat oven to 400°F.","Cook rice and steam broccoli.","Mix honey, lime juice and olive oil; brush over salmon.","Bake salmon until the thickest part reaches 145°F, then serve with rice and broccoli."],"note":"Demo adaptation of your honey-lime salmon meal."},{"id":"pork","name":"🐷 BBQ Pulled Pork (3–5 lb)","meal":["Dinner","Meal Prep"],"ingredients":["Pork","BBQ","Apple Juice","Ketchup"],"servings":6,"batch":true,"items":[["Smithfield bone-in pork shoulder half picnic roast",1,"","3–5 lb (1.4–2.3 kg)","Pork and cooking liquid"],["Snapple Apple Juice Drink",1,"","⅔ cup (160 ml)","Pork and cooking liquid"],["Brown sugar",1,"","2 tbsp (25 g)","Dry rub"],["Paprika",1,"","2 tsp (5 g)","Dry rub"],["Onion powder",1,"","2 tsp (5 g)","Dry rub"],["Mustard powder",1,"","1½ tsp (3 g)","Dry rub"],["Ground cumin",1,"","¾ tsp (1.5 g)","Dry rub"],["Smoked paprika",1,"","¾ tsp (1.5 g)","Dry rub"],["Salt",1,"","2 tsp (12 g)","Dry rub"],["Black pepper",1,"","¾ tsp (1.5 g)","Dry rub"],["Smash Kitchen Organic Tomato Ketchup — use only after verifying garlic-free ingredients",1,"","2 cups (approximately 480 g)","Homemade BBQ sauce"],["Apple cider vinegar",1,"","⅔ cup (160 ml)","Homemade BBQ sauce"],["Water",1,"","⅔ cup (160 ml)","Homemade BBQ sauce"],["Molasses",1,"","2 tbsp (40 g)","Homemade BBQ sauce"],["Brown sugar",1,"","7 tbsp (95 g)","Homemade BBQ sauce"],["Mustard powder",1,"","2¾ tsp (5.5 g)","Homemade BBQ sauce"],["Onion powder",1,"","2 tsp (5 g)","Homemade BBQ sauce"],["Smoked paprika",1,"","¾ tsp (1.5 g)","Homemade BBQ sauce"],["Salt",1,"","1¼ tsp (7.5 g)","Homemade BBQ sauce"],["Black pepper",1,"","1¼ tsp (2.5 g)","Homemade BBQ sauce"],["Cayenne pepper (optional)",1,"","½–1 tsp","Homemade BBQ sauce"],["Apple cider vinegar",1,"","1½ tsp (7.5 ml)","Worcestershire-free flavor replacement"],["Molasses",1,"","¾ tsp (5 g)","Worcestershire-free flavor replacement"],["Onion powder",1,"","⅓ tsp","Worcestershire-free flavor replacement"],["Ground allspice (optional)",1,"","⅛ tsp","Worcestershire-free flavor replacement"]],"products":[{"url":"https://www.walmart.com/ip/713327603","upc":null,"status":"UPC pending — not supplied"},{"url":"https://www.walmart.com/ip/116090478","upc":"076183003282","status":"Verified UPC (user-supplied confirmation); 16 fl oz bottle"},null,null,null,null,null,null,null,null,{"url":"https://www.walmart.com/ip/11173210440","upc":"085006817402","status":"User-authorized UPC — unverified exact 20 oz variant; fails UPC-A checksum"},null,null,null,null,null,null,null,null,null,null,null,null,null,null],"steps":["Season: Combine the dry rub ingredients and coat the pork evenly.","Slow cook: Place the pork in the slow cooker and pour the apple juice around it. Cook on LOW until fork-tender: approximately 7–8 hours for 3 lb, 8–9 hours for 4 lb, or 9–10 hours for 5 lb. Start checking earlier; time varies by roast and cooker. The pork should pull apart effortlessly, typically around 195–205°F internally.","Brown (optional): Transfer the pork to a roasting pan, reserving the slow-cooker juices. Spoon a little reserved pork fat over it and roast at 350°F for 20 minutes. Remove the thick fat cap and roast another 15 minutes.","Make the sauce: Combine all homemade BBQ sauce ingredients and the Worcestershire-free flavor replacement in a saucepan. Simmer for approximately 45 minutes until thickened.","Finish the sauce: Defat the reserved slow-cooker juices, then gradually add ½–⅔ cup to the sauce until it reaches your desired consistency.","Shred: Remove bones and excess fat. Shred the pork with two forks, then gently toss with sauce to taste. Make the full sauce batch even for a 3 lb roast; refrigerate leftover sauce for up to 3–4 days or freeze."],"note":"For a 3–5 lb bone-in shoulder, with a full batch of homemade BBQ sauce. No garlic or Worcestershire is added; packaged ingredients still require allergy verification.","allergy":"Check every packaged ingredient for milk, soy, garlic, barley, watermelon and egg, including spices, flavorings, ketchup, molasses and vinegar. Use the ketchup only once its ingredients and any unclear flavorings are verified garlic-free and suitable for your allergies. UPC matching does not verify allergen safety."},{"id":"soup","name":"🥣 Chicken Taco Soup","meal":["Dinner","Soups","Meal Prep"],"ingredients":["Chicken","Beans","Tomatoes"],"servings":4,"items":[["Chicken breast",1.5,"lb"],["Canned black beans (check label)",1,"can"],["Canned diced tomatoes (check label)",1,"can"],["Frozen corn",1,"cup"],["Water or verified-safe stock",3,"cups"],["Ground cumin",2,"tsp"],["Smoked paprika",1,"tsp"],["Onion powder",1,"tsp"]],"steps":["Combine all ingredients in a pot; bring to a gentle simmer.","Cook until chicken reaches 165°F, about 20–30 minutes depending on thickness.","Remove and shred chicken, return to pot and simmer another 5 minutes.","Taste and adjust seasoning."],"note":"Demo version using single-ingredient spices; check canned food and stock labels."}];
let meal='All',favoritesOnly=false,favorites=new Set();try{const saved=JSON.parse(localStorage.getItem('my-recipe-kitchen-favorites')||'[]');if(Array.isArray(saved))favorites=new Set(saved.filter(id=>recipes.some(r=>r.id===id)))}catch(e){}let selected=recipes.some(r=>r.id===decodeURIComponent(location.hash.slice(1)))?decodeURIComponent(location.hash.slice(1)):recipes[0].id,servings=recipes.find(r=>r.id===selected).servings;
const $=id=>document.getElementById(id);
function toggleFavorite(id){if(favorites.has(id))favorites.delete(id);else favorites.add(id);try{localStorage.setItem('my-recipe-kitchen-favorites',JSON.stringify([...favorites]))}catch(e){}update();render();queueSyncSave();}
$('favoritesFilter').onclick=()=>{favoritesOnly=!favoritesOnly;update()};
function chips(id,vals,active,choose){$(id).innerHTML=vals.map(v=>`<button class="chip ${v===active?'on':''}" data-value="${v}">${v}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.value));}
function update(){chips('meals',['All',...new Set(recipes.flatMap(r=>r.meal))],meal,v=>{meal=v;update()});$('favoritesFilter').classList.toggle('on',favoritesOnly);$('favoritesFilter').setAttribute('aria-pressed',String(favoritesOnly));$('favoritesFilter').textContent=favoritesOnly?'★ Favorites only':'☆ Favorites only';const q=$('search').value.toLowerCase();const found=recipes.filter(r=>(meal==='All'||r.meal.includes(meal))&&(!favoritesOnly||favorites.has(r.id))&&(r.name+' '+r.meal.join(' ')+' '+r.ingredients.join(' ')).toLowerCase().includes(q));$('list').innerHTML=found.map(r=>`<div class="recipe-entry"><button class="recipe ${selected===r.id?'on':''}" data-id="${r.id}">${r.name}<div class="small">${r.meal.join(' · ')}</div></button><button class="favorite-toggle" type="button" data-favorite="${r.id}" aria-pressed="${favorites.has(r.id)}" aria-label="${favorites.has(r.id)?'Remove from':'Add to'} favorites: ${r.name}" title="${favorites.has(r.id)?'Remove favorite':'Add favorite'}">${favorites.has(r.id)?'★':'☆'}</button></div>`).join('')||'<div class="empty">'+(favoritesOnly?'No favorite recipes match. Mark a recipe with ☆ to add it.':'No recipes match.')+'</div>';$('list').querySelectorAll('button.recipe').forEach(b=>b.onclick=()=>{selected=b.dataset.id;location.hash=encodeURIComponent(selected);servings=recipes.find(r=>r.id===selected).servings;update();render();});$('list').querySelectorAll('button.favorite-toggle').forEach(b=>b.onclick=()=>toggleFavorite(b.dataset.favorite));}
function render(){const r=recipes.find(r=>r.id===selected);const f=r.batch?1:servings/r.servings;$('detail').innerHTML=`<div class="small">My recipes / ${r.meal[0]}</div><h1>${r.name}</h1><button id="favoriteRecipe" type="button" class="favorite-action" aria-pressed="${favorites.has(r.id)}">${favorites.has(r.id)?'★ Remove from favorites':'☆ Add to favorites'}</button><p class="subtitle">${r.note}</p><div class="tags">${r.meal.map(t=>`<span class="tag">#${t}</span>`).join('')}</div><div class="flex"><h2>Ingredients</h2>${r.batch?`<div><label for="roastWeight">Roast weight </label><select id="roastWeight"><option value="3">3 lb · 7–8 hours LOW</option><option value="4" selected>4 lb · 8–9 hours LOW</option><option value="5">5 lb · 9–10 hours LOW</option></select></div>`:`<div class="stepper"><button id="minus">−</button><strong>${servings} servings</strong><button id="plus">+</button></div>`}</div><div class="small">${r.batch?'One batch for a 3–5 lb roast. Rub, liquid and full sauce quantities stay fixed. Check off ingredients as you shop.':'Quantities adjust with servings. Check off ingredients as you shop.'}</div>${r.items.map(([name,n,u,quantity,group],i)=>{const p=r.products?.[i];return `${group&&group!==r.items[i-1]?.[4]?`<h3>${group}</h3>`:""}<div class="row"><label><input type="checkbox"><span><b>${r.batch?quantity:Number((n*f).toFixed(2))+" "+u}</b> ${name}${p?`<br><span class="small">${p.upc?"UPC: "+p.upc+" · ":""}${p.status||""}</span>`:''}</span></label><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${p?.upc?`<button type="button" class="upc-copy" data-upc="${p.upc}" style="border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--side);color:var(--fg);cursor:pointer">Copy UPC</button>`:''}${p?`<a target="_blank" rel="noopener" href="${p.url}">Walmart ↗</a>`:r.batch?"":`<a target="_blank" rel="noopener" href="https://www.walmart.com/search?q=${encodeURIComponent(name)}">Walmart ↗</a>`}</span></div>`}).join('')}${r.allergy?`<div class="notice"><b>Allergy checks</b><p>${r.allergy}</p></div>`:""}<h2>Directions</h2><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${r.batch?`<p class="small">Adapted from <a href="https://www.recipetineats.com/pulled-pork-with-bbq-sauce/" target="_blank" rel="noopener">RecipeTin Eats</a> using your supplied recipe. Timing is an estimate; check tenderness.</p>`:`<p class="small">Directions describe the original ${r.servings}-serving batch; adjust cooking times and equipment for larger batches.</p>`}<div style="margin-top:12px"><button id="copyMacroFactor" type="button" class="favorite-action">📋 Copy to MacroFactor</button><span id="macroFactorStatus" class="small" role="status" aria-live="polite" style="display:block;margin-top:8px"></span></div>`;$('favoriteRecipe').onclick=()=>toggleFavorite(r.id);$('copyMacroFactor').onclick=async()=>{const url=new URL('recipes/'+r.id+'.html',location.href);const status=$('macroFactorStatus');let field;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url.href)}else{field=document.createElement('textarea');field.value=url.href;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();if(!document.execCommand('copy'))throw Error('Copy unavailable')}status.textContent='Recipe link copied. Paste it into MacroFactor to import.'}catch(e){status.textContent='Could not copy automatically. Copy this recipe link: '+url.href}finally{field?.remove()}};$('detail').querySelectorAll('.upc-copy').forEach(b=>b.onclick=async()=>{const v=b.dataset.upc;try{await navigator.clipboard.writeText(v);b.textContent='Copied!'}catch(e){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();b.textContent=ok?'Copied!':'Copy unavailable'}});if(r.batch){$('roastWeight').onchange=()=>{const weight=$('roastWeight').value;$('detail').querySelector('.row label b').textContent=weight+' lb (approximately '+({3:'1.4',4:'1.8',5:'2.3'}[weight])+' kg)'};return;}$('minus').onclick=()=>{servings=Math.max(1,servings-1);render()};$('plus').onclick=()=>{servings=Math.min(24,servings+1);render()};}


const syncKey='my-recipe-kitchen-device-token';let syncToken='';try{syncToken=localStorage.getItem(syncKey)||''}catch(e){}let syncCode='',syncCodeUntil=0,syncMessage='',syncBusy=false,syncSaveTimer=null;
function syncMessageSet(message){syncMessage=message;$('syncStatus').textContent=message}
async function syncRequest(action,data={}){const response=await fetch('/api/sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,token:syncToken,...data})});let result;try{result=await response.json()}catch{throw Error('Sync server is not available yet. Try again shortly.')}if(!response.ok)throw Error(result.error||'Sync request failed.');return result}
function saveToken(token){syncToken=token;try{localStorage.setItem(syncKey,token)}catch(e){}}
function applyCloudFavorites(ids){favorites=new Set((ids||[]).filter(id=>recipes.some(r=>r.id===id)));try{localStorage.setItem('my-recipe-kitchen-favorites',JSON.stringify([...favorites]))}catch(e){}update();render()}
function syncUI(){const root=$('syncControls');if(!root)return;if(syncToken){root.innerHTML='<div class="small">Connected on this device</div><div class="sync-actions"><button id="newPairCode" type="button">Connect another device</button><button id="refreshSync" type="button">Refresh</button></div>'+(syncCode&&Date.now()<syncCodeUntil?'<div class="small" style="margin-top:12px">Enter this code on your other device (expires in 5 minutes):</div><div class="sync-code">'+syncCode+'</div>':'');$('newPairCode').onclick=async()=>{try{syncMessageSet('Generating a pairing code…');const r=await syncRequest('code');syncCode=r.code;syncCodeUntil=Date.now()+300000;syncUI();syncMessageSet('Use this code within five minutes. It works once.')}catch(e){syncMessageSet(e.message)}};$('refreshSync').onclick=()=>refreshCloudFavorites(true)}else{root.innerHTML='<div class="small">Sync your favorites across devices. No account needed.</div><div class="sync-actions"><button id="startSync" type="button">Start syncing</button><button id="showJoin" type="button">Enter 4-digit code</button></div><div id="joinArea" style="display:none;margin-top:10px"><label class="small" for="pairCodeInput">Code from your connected device</label><input id="pairCodeInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" placeholder="0000"><div class="sync-actions"><button id="joinSync" type="button">Connect device</button></div></div>';$('startSync').onclick=async()=>{try{syncMessageSet('Setting up sync…');const r=await syncRequest('create',{favorites:[...favorites]});saveToken(r.token);applyCloudFavorites(r.favorites);syncUI();syncMessageSet('Sync enabled! Use Connect another device to get a code.')}catch(e){syncMessageSet(e.message)}};$('showJoin').onclick=()=>{$('joinArea').style.display='block';$('pairCodeInput').focus()};$('joinSync').onclick=async()=>{const code=$('pairCodeInput').value.trim();if(!/^[0-9]{4}$/.test(code)){syncMessageSet('Enter all four digits.');return}try{syncMessageSet('Connecting…');const r=await syncRequest('join',{code,favorites:[...favorites]});saveToken(r.token);applyCloudFavorites(r.favorites);syncUI();syncMessageSet('Device connected! Favorites are synced.')}catch(e){syncMessageSet(e.message)}}}syncMessageSet(syncMessage)}
async function refreshCloudFavorites(showMessage=false){if(!syncToken)return;try{const r=await syncRequest('get');applyCloudFavorites(r.favorites);if(showMessage)syncMessageSet('Favorites are up to date.')}catch(e){if(showMessage)syncMessageSet(e.message)}}
function queueSyncSave(){if(!syncToken)return;clearTimeout(syncSaveTimer);syncSaveTimer=setTimeout(async()=>{try{const r=await syncRequest('save',{favorites:[...favorites]});applyCloudFavorites(r.favorites);syncMessageSet('Favorites synced.')}catch(e){syncMessageSet('Saved on this device. Cloud sync failed: '+e.message)}},350)}
syncUI();if(syncToken){refreshCloudFavorites();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloudFavorites()})}

window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(recipes.some(r=>r.id===id)){selected=id;servings=recipes.find(r=>r.id===id).servings;update();render()}});$('search').oninput=update;update();render();
</script></html>
