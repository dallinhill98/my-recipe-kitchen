<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Recipe Kitchen</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#fff;--side:#f8f8f8;--fg:#222;--muted:#777;--line:#e6e6e6;--selected:#eaeaea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}.layout{display:grid;grid-template-columns:310px 1fr;min-height:100vh}aside{background:var(--side);border-right:1px solid var(--line);padding:22px 15px}main{padding:48px max(24px,calc((100vw - 1080px)/2));max-width:1000px;width:100%}h1{font-size:30px;letter-spacing:-.03em}h2{font-size:18px;margin-top:34px}.brand{font-weight:700;font-size:18px;margin-bottom:20px}.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:23px 0 8px}input[type=search]{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--bg);color:var(--fg);font:inherit}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--fg);padding:6px 10px;cursor:pointer}.chip.on{background:var(--fg);color:var(--bg)}.recipe{width:100%;display:block;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--fg);padding:12px 9px;cursor:pointer;font:inherit}.recipe.on,.recipe:hover{background:var(--selected)}.small{font-size:12px;color:var(--muted)}.subtitle{color:var(--muted)}.tags{margin:18px 0;display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:20px;background:var(--side);padding:5px 10px;font-size:13px}.row{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px}.row label{display:flex;gap:10px}.row a{white-space:nowrap;color:inherit;font-size:13px}.steps li{padding:0 0 15px 5px}.notice{background:var(--side);border:1px solid var(--line);padding:15px;border-radius:12px;font-size:13px;margin-top:25px}.stepper{display:flex;gap:15px;align-items:center}.stepper button{border:1px solid var(--line);border-radius:9px;padding:5px 12px;background:var(--side);color:var(--fg);cursor:pointer}.flex{display:flex;align-items:center;justify-content:space-between}.empty{padding:15px;color:var(--muted)}@media(max-width:700px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:22px}.recipe{padding:9px}.brand{margin-bottom:12px}}@media(prefers-color-scheme:dark){:root{--bg:#212121;--side:#171717;--fg:#f4f4f4;--muted:#aaa;--line:#393939;--selected:#303030}}
.share{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.share button{border:1px solid var(--line);background:var(--side);color:var(--fg);border-radius:11px;padding:11px 16px;font:inherit;cursor:pointer}.share button:hover{background:var(--selected)}</style><div class="layout"><aside><div class="brand">🍽️ My Recipe Kitchen</div><input id="search" type="search" placeholder="Search recipes…"><div class="label">🍽️ FILTER BY MEAL</div><div id="meals" class="chips"></div><div class="label">RECIPES</div><div id="list"></div></aside><main id="detail"></main></div><script>
const recipes=[{"id":"peach-chai","name":"🍑 Peach Chai Protein Smoothie","meal":["Breakfast","Smoothies"],"ingredients":["Peaches","Oats","Protein Powder","Peanut Butter"],"servings":1,"items":[["Jif Natural Creamy Peanut Butter",33,"g"],["Great Value Old Fashioned Oats",40,"g"],["Manitoba Harvest Hemp Hearts",40,"g"],["Sunwarrior Organic Vanilla Protein Powder",26,"g"],["TAZO Classic Chai Latte Concentrate",120,"g"],["Planet Oat Barista Lovers Oatmilk",120,"g"],["Great Value Frozen Sliced Peaches",210,"g"]],"products":[{"upc":"051500243213","url":"https://www.walmart.com/ip/21096191"},{"upc":"078742371047","url":"https://www.walmart.com/ip/10314925"},{"upc":"697658201219","url":"https://www.walmart.com/ip/17081672273"},{"upc":"810100920968","url":"https://www.walmart.com/ip/5522276790"},{"upc":"794522703005","url":"https://www.walmart.com/ip/14869684"},{"upc":"044100190926","url":"https://www.walmart.com/ip/5040429010"},{"upc":"078742431031","url":"https://www.walmart.com/ip/10543667"}],"steps":["Add oatmilk and chai concentrate to a blender.","Add peanut butter, oats, hemp hearts, protein powder and frozen peaches.","Blend until smooth. Add a little water if needed."],"note":"Seven exact Walmart products with confirmed UPCs. Check ingredient labels for your food allergies; UPC confirmation does not verify allergen safety."},{"id": "maple", "name": "🍁 Maple-Ginger Chicken & Rice Bowls", "meal": ["Dinner", "Meal Prep"], "ingredients": ["Chicken", "Rice"], "servings": 3, "items": [["Chicken breast", 800, "g"], ["Dry white rice", 278, "g"], ["Water for rice", 2, "cups"], ["Verified-safe cooking oil", 28, "g"], ["Coconut aminos (check label)", 6, "tbsp"], ["Pure maple syrup", 3, "tbsp"], ["Brown sugar", 1, "tbsp"], ["Ground ginger", 1.25, "tsp"], ["Onion powder", 1.375, "tsp"], ["Smoked paprika", 1, "tsp"], ["Cornstarch", 1.5, "tsp"]], "steps": ["Cook rice according to its package directions.", "Season chicken with ginger, onion powder and paprika; cook in oil to 165°F.", "Simmer coconut aminos, maple syrup and brown sugar with a splash of water; thicken with cornstarch slurry.", "Toss chicken with sauce and serve over rice."], "note": "Based on your earlier chicken bowl; simplified demonstration quantities."}, {"id": "salmon", "name": "🍯 Honey-Lime Salmon & Rice", "meal": ["Dinner"], "ingredients": ["Salmon", "Rice"], "servings": 2, "items": [["Skinless salmon", 16, "oz"], ["Dry white rice", 0.75, "cup"], ["Honey", 2, "tbsp"], ["Fresh lime juice", 2, "tbsp"], ["Olive oil", 1, "tbsp"], ["Salt", 0.5, "tsp"], ["Broccoli", 2, "cups"]], "steps": ["Heat oven to 400°F.", "Cook rice and steam broccoli.", "Mix honey, lime juice and olive oil; brush over salmon.", "Bake salmon until the thickest part reaches 145°F, then serve with rice and broccoli."], "note": "Demo adaptation of your honey-lime salmon meal."}, {"id": "pork", "name": "🐷 Simple Pulled Pork", "meal": ["Dinner", "Meal Prep"], "ingredients": ["Pork"], "servings": 6, "items": [["Pork shoulder", 3, "lb"], ["Apple cider vinegar", 0.25, "cup"], ["Brown sugar", 2, "tbsp"], ["Smoked paprika", 2, "tsp"], ["Onion powder", 2, "tsp"], ["Salt", 1.5, "tsp"], ["Water", 0.5, "cup"]], "steps": ["Mix seasonings and rub over pork.", "Add pork, water and vinegar to a slow cooker.", "Cook on low about 8–10 hours until tender and easy to shred.", "Shred, discard bones and excess fat, and mix with cooking juices."], "note": "Garlic-free base recipe; no commercial BBQ sauce assumed safe."}, {"id": "soup", "name": "🥣 Chicken Taco Soup", "meal": ["Dinner", "Soups", "Meal Prep"], "ingredients": ["Chicken", "Beans", "Tomatoes"], "servings": 4, "items": [["Chicken breast", 1.5, "lb"], ["Canned black beans (check label)", 1, "can"], ["Canned diced tomatoes (check label)", 1, "can"], ["Frozen corn", 1, "cup"], ["Water or verified-safe stock", 3, "cups"], ["Ground cumin", 2, "tsp"], ["Smoked paprika", 1, "tsp"], ["Onion powder", 1, "tsp"]], "steps": ["Combine all ingredients in a pot; bring to a gentle simmer.", "Cook until chicken reaches 165°F, about 20–30 minutes depending on thickness.", "Remove and shred chicken, return to pot and simmer another 5 minutes.", "Taste and adjust seasoning."], "note": "Demo version using single-ingredient spices; check canned food and stock labels."}];
let meal='All',selected=recipes.some(r=>r.id===decodeURIComponent(location.hash.slice(1)))?decodeURIComponent(location.hash.slice(1)):recipes[0].id,servings=recipes.find(r=>r.id===selected).servings;
const $=id=>document.getElementById(id);
function chips(id,vals,active,choose){$(id).innerHTML=vals.map(v=>`<button class="chip ${v===active?'on':''}" data-value="${v}">${v}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.value));}
function update(){chips('meals',['All',...new Set(recipes.flatMap(r=>r.meal))],meal,v=>{meal=v;update()});const q=$('search').value.toLowerCase();const found=recipes.filter(r=>(meal==='All'||r.meal.includes(meal))&&(r.name+' '+r.meal.join(' ')+' '+r.ingredients.join(' ')).toLowerCase().includes(q));$('list').innerHTML=found.map(r=>`<button class="recipe ${selected===r.id?'on':''}" data-id="${r.id}">${r.name}<div class="small">${r.meal.join(' · ')}</div></button>`).join('')||'<div class="empty">No recipes match.</div>';$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;location.hash=encodeURIComponent(selected);servings=recipes.find(r=>r.id===selected).servings;update();render();});}
function render(){const r=recipes.find(r=>r.id===selected);const f=servings/r.servings;$('detail').innerHTML=`<div class="small">My recipes / ${r.meal[0]}</div><h1>${r.name}</h1><p class="subtitle">${r.note}</p><div class="tags">${r.meal.map(t=>`<span class="tag">#${t}</span>`).join('')}</div><div class="flex"><h2>Ingredients</h2><div class="stepper"><button id="minus">−</button><strong>${servings} servings</strong><button id="plus">+</button></div></div><div class="small">Quantities adjust with servings. Check off ingredients as you shop.</div>${r.items.map(([name,n,u],i)=>{const p=r.products?.[i];return `<div class="row"><label><input type="checkbox"><span><b>${Number((n*f).toFixed(2))} ${u}</b> ${name}${p?`<br><span class="small">UPC: ${p.upc}</span>`:''}</span></label><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${p?`<button type="button" class="upc-copy" data-upc="${p.upc}" style="border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--side);color:var(--fg);cursor:pointer">Copy UPC</button>`:''}<a target="_blank" rel="noopener" href="${p?p.url:'https://www.walmart.com/search?q='+encodeURIComponent(name)}">Walmart ↗</a></span></div>`}).join('')}<h2>Directions</h2><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="share"><button id="copyLink" type="button">🔗 Copy recipe link</button><span id="copyStatus" class="small" role="status" aria-live="polite"></span></div><p class="small">Directions describe the original ${r.servings}-serving batch; adjust cooking times and equipment for larger batches.</p>`;$('detail').querySelectorAll('.upc-copy').forEach(b=>b.onclick=async()=>{const v=b.dataset.upc;try{await navigator.clipboard.writeText(v);b.textContent='Copied!'}catch(e){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();b.textContent=ok?'Copied!':'Copy unavailable'}});$('minus').onclick=()=>{servings=Math.max(1,servings-1);render()};$('plus').onclick=()=>{servings=Math.min(24,servings+1);render()};$('copyLink').onclick=async()=>{const url=new URL(location.href);url.hash='';url.pathname=url.pathname.replace(/(?:index\.html)?$/, '')+'recipes/'+r.id+'.html';const status=$('copyStatus');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url.href)}else{const field=document.createElement('textarea');field.value=url.href;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();if(!document.execCommand('copy'))throw Error('copy unavailable');field.remove()}status.textContent=url.protocol==='file:'?'Copied local file link — publish the site for a shareable URL.':'Link copied! MacroFactor import may require a public recipe page.'}catch(e){status.textContent='Copy unavailable in this preview. Open the site in Safari after publishing.'}};}
window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(recipes.some(r=>r.id===id)){selected=id;servings=recipes.find(r=>r.id===id).servings;update();render()}});$('search').oninput=update;update();render();
</script></html>
